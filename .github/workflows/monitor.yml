name: Portfolio monitor

# Runs the full pipeline (Layers 1-4) once each weekday after the US market closes,
# and whenever you press "Run workflow". Monitor only: it never places orders.
on:
  schedule:
    - cron: "35 21 * * 1-5"    # 21:35 UTC = 1:35 PM Pacific in winter (2:35 PM in summer)
  workflow_dispatch:
    inputs:
      asof:
        description: "Date stamp YYYY-MM-DD (leave empty for today)"
        required: false
      test_message:
        description: "Only send a test message to your phone (no full run)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write                # only used if the notifier channel is "github"

concurrency:
  group: monitor               # separate from the trading bot's lock
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r monitor/requirements.txt
      - name: Send a test message
        if: ${{ inputs.test_message }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m monitor.notifier
      - name: Tests
        if: ${{ !inputs.test_message }}
        run: python -m unittest discover -s monitor/tests -t .
      - name: Run the monitor (log saved to monitor/logs)
        if: ${{ !inputs.test_message }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}     # optional: Claude news
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}         # optional: read-only IB positions sync
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          ALPACA_AUTO_KEY: ${{ secrets.ALPACA_AUTO_KEY }}         # optional: practice autopilot (paper account)
          ALPACA_AUTO_SECRET: ${{ secrets.ALPACA_AUTO_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # optional: notifier
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p monitor/logs
          python -m monitor.ibkr_sync 2>&1 | tee -a "monitor/logs/run_$(date -u +%F).log"
          python -m monitor.run ${{ inputs.asof && format('--asof {0}', inputs.asof) || '' }} 2>&1 | tee -a "monitor/logs/run_$(date -u +%F).log"
      - name: Save snapshots, database and log
        if: ${{ !inputs.test_message }}
        run: |
          git config user.name "portfolio-monitor"
          git config user.email "portfolio-monitor@users.noreply.github.com"
          git add monitor/snapshots monitor/monitor.db monitor/output monitor/logs monitor/positions.json monitor/autotrade
          git diff --cached --quiet || (git commit -m "Monitor run" && \
            (git push || (git pull --rebase -X theirs && git push)))   # this run's results win over older copies
