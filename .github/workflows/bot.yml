name: Paper trading bot

# Always-on version (for a PUBLIC repo, where GitHub minutes are free).
# One run stays awake ~5.5 hours and runs bot.py every 30 minutes,
# then starts its own replacement. GitHub's schedule below is only a backup
# that restarts the chain if it ever stops.

on:
  workflow_dispatch: {}        # "Run workflow" button, also used to start the next run
  schedule:
    - cron: "17 */6 * * *"     # backup restart every 6 hours

permissions:
  contents: write              # save state.json, REPORT.md, trades
  actions: write               # start the next run
  issues: write                # SpaceX alerts arrive as GitHub notifications

concurrency:
  group: bot
  cancel-in-progress: false    # never two bots at once; extra starts wait in line

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Run bot every 30 minutes for about 5.5 hours
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}        # empty until you go live
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
          ALPACA_AUTO_KEY: ${{ secrets.ALPACA_AUTO_KEY }}        # practice autopilot (separate paper account)
          ALPACA_AUTO_SECRET: ${{ secrets.ALPACA_AUTO_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          stop_at=$(( $(date +%s) + 330*60 ))
          while true; do
            echo "::group::Bot run at $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash -q || true      # pick up any bot.py you edited
            python bot.py || echo "Bot hit an error this round; will try again in 30 minutes."
            python -m monitor.autotrade execute || echo "Autopilot hit an error; will try again in 30 minutes."
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Bot update"
              git pull --rebase -q && git push -q || echo "Could not save this round; will retry."
            fi
            echo "::endgroup::"
            now=$(date +%s)
            next=$(( (now / 1800 + 1) * 1800 + 60 ))      # 1 minute after the next :00 or :30
            if [ "$next" -ge "$stop_at" ]; then break; fi
            sleep $(( next - now ))
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main --repo "$GITHUB_REPOSITORY"
